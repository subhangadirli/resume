name: Build and Release Resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install Python dependencies
        run: pip install odfpy cairosvg

      - name: Install resume fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp assets/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f ~/.local/share/fonts

      - name: Build ODT (canonical artifacts)
        run: |
          python3 build_resume.py --out dist
          ls -la dist/

      - name: Export PDF from ODT (LibreOffice, layout-identical)
        run: |
          soffice --headless --convert-to pdf --outdir dist dist/Subhan-Gadirli-Resume.odt dist/Subhan-Gadirli-Resume-ATS.odt
          ls -la dist/

      - name: Upload build artifacts (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: dist/*

      - name: Publish evergreen 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="ODT is the canonical build artifact; PDF is a LibreOffice export of the same ODT, layout-identical. Built from ${GITHUB_SHA} on master."
          gh release delete latest --yes --cleanup-tag || true
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release create latest dist/* --title "Latest Resume" --notes "$NOTES" --latest
