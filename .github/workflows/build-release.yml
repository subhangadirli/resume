name: Build and Release Resume

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libjpeg-dev libopenjp2-7-dev libffi-dev pandoc

      - name: Install WeasyPrint
        run: pip install weasyprint

      - name: Build PDFs (faithful renders)
        run: |
          mkdir -p dist
          weasyprint resume.html dist/Subhan-Gadirli-Resume.pdf
          weasyprint resume_ats.html dist/Subhan-Gadirli-Resume-ATS.pdf

      - name: Build DOCX and ODT (Pandoc conversions, content-correct, styling best-effort)
        run: |
          pandoc resume.html -f html -t docx --resource-path=. --standalone -o dist/Subhan-Gadirli-Resume.docx
          pandoc resume.html -f html -t odt --resource-path=. --standalone -o dist/Subhan-Gadirli-Resume.odt
          pandoc resume_ats.html -f html -t docx --resource-path=. --standalone -o dist/Subhan-Gadirli-Resume-ATS.docx
          pandoc resume_ats.html -f html -t odt --resource-path=. --standalone -o dist/Subhan-Gadirli-Resume-ATS.odt

      - name: Upload build artifacts (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: dist/*

      - name: Publish evergreen 'latest' release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Auto-built from ${GITHUB_SHA} on master. PDFs are faithful renders (WeasyPrint). DOCX/ODT are Pandoc conversions (content-correct, styling best-effort; use ATS files for editing/ATS)."
          gh release delete latest --yes --cleanup-tag || true
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release create latest dist/* --title "Latest Resume" --notes "$NOTES" --latest
